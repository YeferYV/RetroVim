# rattler-build auth login anaconda.org --conda-token $ANACONDA_API_KEY

# https://rattler-build.prefix.dev/latest/getting_started/#publishing-the-package
# rattler-build publish --recipe oxfmt.yaml --target-platform linux-64      --to https://anaconda.org/retronvim
# rattler-build publish --recipe oxfmt.yaml --target-platform linux-aarch64 --to https://anaconda.org/retronvim
# rattler-build publish --recipe oxfmt.yaml --target-platform osx-64        --to https://anaconda.org/retronvim
# rattler-build publish --recipe oxfmt.yaml --target-platform osx-arm64     --to https://anaconda.org/retronvim
# rattler-build publish --recipe oxfmt.yaml --target-platform win-64        --to https://anaconda.org/retronvim

context:
  version: 1.82.0 # oxlint version

package:
  name: oxfmt
  version: 0.67.0 # oxfmt version

source:
  - if: target_platform == "linux-64"
    then:
      - url: https://github.com/oxc-project/oxc/releases/download/apps_v${{ version }}/oxfmt-x86_64-unknown-linux-gnu.tar.gz

  - if: target_platform == "linux-aarch64"
    then:
      - url: https://github.com/oxc-project/oxc/releases/download/apps_v${{ version }}/oxfmt-aarch64-unknown-linux-gnu.tar.gz

  - if: target_platform == "osx-64"
    then:
      - url: https://github.com/oxc-project/oxc/releases/download/apps_v${{ version }}/oxfmt-x86_64-apple-darwin.tar.gz

  - if: target_platform == "osx-arm64"
    then:
      - url: https://github.com/oxc-project/oxc/releases/download/apps_v${{ version }}/oxfmt-aarch64-apple-darwin.tar.gz

  - if: target_platform == "win-64"
    then:
      - url: https://github.com/oxc-project/oxc/releases/download/apps_v${{ version }}/oxfmt-x86_64-pc-windows-msvc.zip

build:
  # number: 0 # build version

  dynamic_linking:
    # fixes macos builds from linux: failed to find `install_name_tool`
    # https://rattler-build.prefix.dev/latest/build_options/#dynamic-linking-configuration
    binary_relocation: false

  script:
    interpreter: bash
    content:
      - mkdir -p        $PREFIX/bin
      - cp    -r oxfmt* $PREFIX/bin/oxfmt

      - if: win
        then:
          - mv $PREFIX/bin/oxfmt $PREFIX/bin/oxfmt.exe

tests:
  - package_contents:
      bin:
        - oxfmt*

about:
  summary: A collection of high-performance JavaScript tools.
  homepage: https://oxc.rs
  repository: https://github.com/oxc-project/oxc
