# pixi clean cache --build --yes

# https://pixi.prefix.dev/dev/reference/cli/pixi/global/install
# pixi g install --path ./oxfmt-channel/linux-64/oxfmt*
# pixi g install --path ./oxfmt-channel/linux-aarch64/oxfmt*
# pixi g install --path ./oxfmt-channel/osx-64/oxfmt*
# pixi g install --path ./oxfmt-channel/osx-aarch64/oxfmt*
# pixi g install --path ./oxfmt-channel/win-64/oxfmt-0.67.0-h9490d1a_0.conda

