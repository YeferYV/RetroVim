# rattler-build build --recipe oxfmt.yaml --target-platform linux-aarch64 --output-dir oxfmt-channel
# rattler-build build --recipe oxfmt.yaml --target-platform osx-64        --output-dir oxfmt-channel
# rattler-build build --recipe oxfmt.yaml --target-platform osx-arm64     --output-dir oxfmt-channel
# rattler-build build --recipe oxfmt.yaml --target-platform win-64        --output-dir oxfmt-channel

