# rattler-build build --recipe typescript.yaml --target-platform linux-64      --output-dir typescript-channel
# rattler-build build --recipe typescript.yaml --target-platform linux-aarch64 --output-dir typescript-channel
# rattler-build build --recipe typescript.yaml --target-platform osx-64        --output-dir typescript-channel
# rattler-build build --recipe typescript.yaml --target-platform osx-arm64     --output-dir typescript-channel
# rattler-build build --recipe typescript.yaml --target-platform win-64        --output-dir typescript-channel

# https://pixi.prefix.dev/dev/reference/cli/pixi/clean/cache
# pixi clean cache --build --yes

# https://pixi.prefix.dev/dev/reference/cli/pixi/global/install
# pixi g install --path ./typescript-channel/linux-64/typescript*
# pixi g install --path ./typescript-channel/linux-aarch64/typescript*
# pixi g install --path ./typescript-channel/osx-64/typescript*
# pixi g install --path ./typescript-channel/osx-aarch64/typescript*
# pixi g install --path ./typescript-channel/win-64/typescript-7.0.2-h9490d1a_0.conda

# https://rattler-build.prefix.dev/latest/getting_started/#authentication
# rattler-build auth login anaconda.org --conda-token $ANACONDA_API_KEY

# https://rattler-build.prefix.dev/latest/getting_started/#publishing-the-package
# rattler-build publish --recipe typescript.yaml --target-platform linux-64      --to https://anaconda.org/retronvim
# rattler-build publish --recipe typescript.yaml --target-platform linux-aarch64 --to https://anaconda.org/retronvim
# rattler-build publish --recipe typescript.yaml --target-platform osx-64        --to https://anaconda.org/retronvim
# rattler-build publish --recipe typescript.yaml --target-platform osx-arm64     --to https://anaconda.org/retronvim
# rattler-build publish --recipe typescript.yaml --target-platform win-64        --to https://anaconda.org/retronvim

context:
  version: 7.0.2

package:
  name: typescript
  version: ${{ version }}

source:
  - if: target_platform == "linux-64"
    then:
      - url: https://github.com/microsoft/TypeScript/releases/download/v${{ version }}/typescript-linux-x64.tgz

  - if: target_platform == "linux-aarch64"
    then:
      - url: https://github.com/microsoft/TypeScript/releases/download/v${{ version }}/typescript-linux-arm64.tgz

  - if: target_platform == "osx-64"
    then:
      - url: https://github.com/microsoft/TypeScript/releases/download/v${{ version }}/typescript-darwin-x64.tgz

  - if: target_platform == "osx-arm64"
    then:
      - url: https://github.com/microsoft/TypeScript/releases/download/v${{ version }}/typescript-darwin-arm64.tgz

  - if: target_platform == "win-64"
    then:
      - url: https://github.com/microsoft/TypeScript/releases/download/v${{ version }}/typescript-win32-x64.tgz

build:
  # number: 0 # build version

  dynamic_linking:
    # fixes macos builds from linux: failed to find `install_name_tool`
    # https://rattler-build.prefix.dev/latest/build_options/#dynamic-linking-configuration
    binary_relocation: false

  script:
    interpreter: bash
    content:
      - mkdir -p       $PREFIX/bin
      - cp    -r lib/* $PREFIX/bin

tests:
  - package_contents:
      bin:
        - tsc*

about:
  summary: TypeScript is a superset of JavaScript that compiles to clean JavaScript output.
  homepage: https://www.typescriptlang.org
  repository: https://github.com/microsoft/typescript
